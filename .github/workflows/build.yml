name: Build image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps.json, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

env:
  FRAPPE_BRANCH: version-16
  IMAGE: ghcr.io/diogo-91/erpgferro

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mine

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builder

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare build context
        run: |
          cp mine/Containerfile builder/Containerfile.erpgferro
          cp mine/apps.json builder/apps.json

      - name: Show apps.json
        run: |
          echo "--- apps.json ---"
          cat mine/apps.json
          python3 -c "import json;print('apps:',len(json.load(open('mine/apps.json'))))"

      - name: Build (local test)
        uses: docker/build-push-action@v6
        with:
          context: builder
          file: builder/Containerfile.erpgferro
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          platforms: linux/amd64
          load: true
          tags: local/erpgferro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify apps in image
        run: |
          docker run --rm --entrypoint bash local/erpgferro:test -c "ls apps; cat sites/apps.txt 2>/dev/null; ./env/bin/pip list 2>/dev/null | grep -iE 'frappe|erpnext|payments|crm|helpdesk'"
          for a in frappe erpnext payments crm helpdesk; do
            docker run --rm --entrypoint bash local/erpgferro:test -c "test -d apps/$a" || { echo "FALTA o app $a"; exit 1; }
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: builder
          file: builder/Containerfile.erpgferro
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
