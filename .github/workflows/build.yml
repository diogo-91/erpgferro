name: Build image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps.json, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

env:
  FRAPPE_BRANCH: version-16
  IMAGE: ghcr.io/diogo-91/erpgferro

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mine

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builder

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare build context
        run: |
          cp mine/Containerfile builder/Containerfile.erpgferro
          cp mine/apps.json builder/apps.json

      - name: Show apps.json
        run: |
          cat mine/apps.json

      - name: Build and push (tag do run)
        uses: docker/build-push-action@v6
        with:
          context: builder
          file: builder/Containerfile.erpgferro
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify apps in image
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.run_number }}
          for a in frappe erpnext payments crm helpdesk; do
            docker run --rm --entrypoint bash ${{ env.IMAGE }}:${{ github.run_number }} -c "test -d apps/$a" || { echo "FALTA o app $a"; exit 1; }
            echo "ok: $a"
          done

      - name: Promote to latest
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:${{ github.run_number }}
