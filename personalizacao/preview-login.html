<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia da tela de login - GFerro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  /* aproximação do tema do Frappe (só para a prévia local) */
  body { font-family: system-ui, sans-serif; margin: 0; }
  .page-card-head { text-align: center; }
  .page-card-head .app-logo { width: 48px; height: 48px; background: #ccc; border-radius: 8px; display: inline-block; margin-bottom: 12px; }
  .login-content { border: 1px solid #ddd; background: #fff; padding: 32px; border-radius: 12px; }
  .btn-login-with-email-link { margin-top: 12px; }
  .web-footer, .navbar { background: #eee; padding: 8px 16px; }
</style>
</head>
<body data-path="login">
  <nav class="navbar">navbar</nav>
  <div id="page-login">
    <div class="page-content-wrapper">
      <main class="container">
        <div class="page_content">
          <section class="for-login">
            <div>
              <div class="login-content page-card">
                <div class="page-card-head">
                  <span class="app-logo"></span>
                  <h4>Entrar no ERP GFerro</h4>
                  <p class="page-card-subtitle">Acesse com seu e-mail e senha</p>
                </div>
                <form>
                  <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="text" placeholder="voce@gferro.com.br">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input class="form-control" type="password" placeholder="••••••••">
                    <p class="forgot-password-message"><a href="#">Esqueceu a senha?</a></p>
                  </div>
                  <button type="button" class="btn btn-primary btn-block btn-login w-100">Entrar</button>
                  <button type="button" class="btn btn-default btn-login-with-email-link w-100">Entrar com link de e-mail</button>
                </form>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <footer class="web-footer">
    <div class="footer-info"><div class="footer-col-left">© Grupo Gferro 2026
Rua Exemplo, 123 - Centro</div></div>
  </footer>

<script>
  // carrega o script real e troca só a imagem de fundo pelo arquivo local
  fetch("login-website-script.js").then(r => r.text()).then(src => {
    src = src.replace(/var BG_URL = ".*?";/, 'var BG_URL = "gferro-login-bg.webp";');
    (0, eval)(src);
  });
</script>
</body>
</html>
