<style>
@page { size: 86mm 54mm; margin: 0; }
.print-format { padding: 0 !important; margin: 0 !important; max-width: none !important; }
.gfc { width: 86mm; height: 54mm; box-sizing: border-box; padding: 4mm 5mm; overflow: hidden; font-family: Arial, Helvetica, sans-serif; color: #000;
  border: 0.3mm solid #000; background: #fff; }
.gfc-topo { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 0.5mm solid #000; padding-bottom: 1.4mm; }
.gfc-marca { font-size: 11pt; font-weight: 800; letter-spacing: .2em; }
.gfc-tipo { font-size: 7.5pt; font-weight: 700; letter-spacing: .08em; }
.gfc-nome { margin-top: 3mm; font-size: 12pt; font-weight: 800; line-height: 1.15; text-transform: uppercase; max-height: 14mm; overflow: hidden; }
.gfc-mat { margin-top: 1mm; font-size: 8pt; color: #333; }
.gfc-cb { display: block; margin: 2.5mm auto 0; height: 14mm; max-width: 74mm; }
.gfc-num { text-align: center; font-family: "Courier New", monospace; font-size: 11pt; font-weight: 800; letter-spacing: .18em; margin-top: .4mm; }
</style>
<div class="gfc">
  <div class="gfc-topo"><span class="gfc-marca">GFERRO</span><span class="gfc-tipo">CRACHÁ DE APONTAMENTO</span></div>
  <div class="gfc-nome">{{ doc.nome }}</div>
  <div class="gfc-mat">Matrícula</div>
  <img class="gfc-cb" src="{{ gf_barcode(doc.matricula) }}" alt="">
  <div class="gfc-num">{{ doc.matricula }}</div>
</div>
