# Compose para o Easypanel (servico "Docker Compose").
# Variaveis a definir no Easypanel: DB_PASSWORD, ADMIN_PASSWORD
# Dominio: apontar erp.gferro.com.br para o servico "frontend", porta 8080.

x-image: &image
  image: ghcr.io/diogo-91/erpgferro:latest
  pull_policy: always
  restart: unless-stopped
  platform: linux/amd64

x-backend: &backend
  <<: *image
  volumes:
    - sites2:/home/frappe/frappe-bench/sites
    - logs2:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db-data2:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data2:/data

  configurator:
    <<: *image
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    volumes:
      - sites2:/home/frappe/frappe-bench/sites
      - logs2:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: *image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Aguardando sites/common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "common_site_config.json nao encontrado";
            exit 1
          fi
        done;
        if [ -d "sites/erp.gferro.com.br" ]; then
          echo "Site ja existe, nada a fazer";
        else
          bench new-site erp.gferro.com.br             --mariadb-user-host-login-scope='%'             --admin-password="$$ADMIN_PASSWORD"             --db-root-username=root             --db-root-password="$$DB_PASSWORD"             --install-app erpnext             --install-app payments             --install-app crm             --install-app helpdesk             --set-default;
        fi;
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - sites2:/home/frappe/frappe-bench/sites
      - logs2:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *backend
    environment:
      GUNICORN_THREADS: 4
      GUNICORN_WORKERS: 2
      GUNICORN_TIMEOUT: 120

  frontend:
    <<: *image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: 8080
      FRAPPE_SITE_NAME_HEADER: erp.gferro.com.br
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites2:/home/frappe/frappe-bench/sites
      - logs2:/home/frappe/frappe-bench/logs
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: *backend
    command: bench worker --queue short,default

  queue-long:
    <<: *backend
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend
    command: bench schedule

volumes:
  db-data2:
  redis-queue-data2:
  sites2:
  logs2:
